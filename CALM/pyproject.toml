[project]
name = "calm-online"
version = "0.1.0"
description = "Online CALM Hard and CALM Soft generation"
requires-python = ">=3.11"
dependencies = [
  "accelerate>=1.0",
  "torch>=2.6",
  "torchvision>=0.21",
  "transformers>=4.57,<5",
  "vllm>=0.10",
]

[project.scripts]
calm-online = "calm.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.11",
]

[tool.uv]
index-strategy = "unsafe-best-match"

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calm"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
